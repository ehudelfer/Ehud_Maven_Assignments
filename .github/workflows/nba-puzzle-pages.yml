name: Deploy NBA puzzle game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Ehud's_Programs/nba-puzzle-web/**"
      - ".github/workflows/nba-puzzle-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web game
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Ehud's_Programs/nba-puzzle-web"
      - name: Publish web game
        id: deployment
        uses: actions/deploy-pages@v4